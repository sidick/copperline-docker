# The image's stock nginx server block (keep in sync with the repo's
# nginx-default.conf) plus HTTP basic auth on the whole site. Whole-site
# auth is deliberate: protecting only /files/ would leave the page usable
# but make its fetch() calls stumble over the credential prompt, and the
# ROMs are the thing being protected anyway.
server {
    # Port 8080, not 80: the container runs nginx as a non-root user.
    listen 8080;
    listen [::]:8080;
    server_name _;

    auth_basic "Copperline";
    auth_basic_user_file /etc/nginx/.htpasswd;

    root /usr/share/nginx/html;
    index index.html;

    # Do NOT add a `types { ... }` block: it would replace the inherited
    # map and break JS/wasm module loading. This location only backstops
    # the wasm type.
    location ~ \.wasm$ {
        default_type application/wasm;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/javascript text/css application/json;

    location / {
        try_files $uri $uri/ =404;
    }

    # User-mounted disks/ROMs; autoindex feeds the page's list dropdowns.
    location /files/ {
        autoindex on;
    }
}
