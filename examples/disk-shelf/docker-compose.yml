# A browsable shelf of your disk library: everything in ./disks appears in
# the page's "DF0 from list..." dropdown (and any .rom files in the
# Kickstart list). To curate the list - friendly names, files in
# subdirectories - copy index.json.example to ./disks/index.json and edit;
# it replaces the scraped listing (with one caveat: a manifest feeds both
# dropdowns unfiltered - see the main README's "Curating the disk list").
services:
  copperline:
    image: ghcr.io/sidick/copperline
    ports:
      - "8080:8080"
    volumes:
      - ./disks:/usr/share/nginx/html/files:ro
    environment:
      COPPERLINE_TITLE: "The Disk Shelf"
      COPPERLINE_SUBTITLE: "Pick a disk from the list and boot"
    restart: unless-stopped
